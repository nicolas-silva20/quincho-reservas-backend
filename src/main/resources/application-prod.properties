# ===================================
# CONFIGURACION DE PRODUCCION
# ===================================

# MySQL Railway - USAR VARIABLES DE ENTORNO
spring.datasource.url=${SPRING_DATASOURCE_URL}?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.jdbc.charset=UTF-8
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# Logging
logging.level.root=WARN
logging.level.com.elumbral.quincho=INFO

# Email - USAR VARIABLES DE ENTORNO
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS - USAR VARIABLE DE ENTORNO
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# JWT Secret
jwt.secret=${JWT_SECRET}

# Archivos
spring.servlet.multipart.max-file-size=10MB
